server {
    listen 80;
    listen [::]:80;
    server_name talk.wangjinkun333.me 182.92.85.15;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/token-talk-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /api/health {
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host 182.92.85.15;
        proxy_set_header X-Forwarded-Proto http;
    }

    location / {
        return 308 https://182.92.85.15$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 182.92.85.15;

    ssl_certificate /etc/nginx/ssl/token-talk-ip/server.crt;
    ssl_certificate_key /etc/nginx/ssl/token-talk-ip/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TokenTalkTLS:10m;
    ssl_session_timeout 1d;

    auth_basic "Token Talk Studio";
    auth_basic_user_file /etc/nginx/token-talk.htpasswd;
    client_max_body_size 256m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self' data:; form-action 'self'; frame-ancestors 'none'; img-src 'self' blob: data: https:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;

    location = /api/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:4321;
        proxy_set_header Host 182.92.85.15;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 仅用于根路径镜像发布失败时，让上一版 /token-talk/ 构建仍可回滚访问。
    location ^~ /token-talk/ {
        proxy_pass http://127.0.0.1:4321/;
        proxy_http_version 1.1;
        proxy_set_header Host 182.92.85.15;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:4321;
        proxy_http_version 1.1;
        proxy_set_header Host 182.92.85.15;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1200s;
        proxy_send_timeout 1200s;
        proxy_request_buffering off;
    }
}
