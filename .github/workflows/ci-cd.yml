name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: token-talk-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Test, build, and browser QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes espeak-ng ffmpeg nginx openssl
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: bash scripts/smoke-production-build.sh
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: bash -n scripts/backup-production.sh scripts/deploy-production.sh scripts/setup-codex-broker-host.sh scripts/smoke-production-build.sh deploy/certbot/token-talk-ip-deploy-hook.sh
      - run: docker compose --env-file .env.prod.example -f docker/docker-compose.prod.yml config --quiet
      - name: Validate Nginx ingress config
        run: |
          set -Eeuo pipefail
          sudo install -d -m 700 /etc/nginx/ssl/token-talk-ip
          sudo openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 1 \
            -subj '/CN=182.92.85.15' \
            -addext 'subjectAltName=IP:182.92.85.15,DNS:talk.wangjinkun333.me' \
            -keyout /etc/nginx/ssl/token-talk-ip/server.key \
            -out /etc/nginx/ssl/token-talk-ip/server.crt
          printf 'token-talk:$2y$05$ci-placeholder\n' | sudo tee /etc/nginx/token-talk.htpasswd >/dev/null
          sudo cp deploy/nginx/talk.wangjinkun333.me.conf /etc/nginx/conf.d/token-talk.conf
          sudo nginx -t
      - name: Build the production image
        run: |
          docker build \
            --build-arg NODE_IMAGE=public.ecr.aws/docker/library/node:22-alpine \
            --build-arg NPM_REGISTRY=https://registry.npmjs.org \
            --build-arg APP_BASE_PATH=/ \
            --file docker/Dockerfile \
            --tag token-talk:ci \
            .
      - name: Smoke test the production image
        run: |
          set -Eeuo pipefail
          docker run --detach --rm --name token-talk-ci \
            --publish 127.0.0.1:4329:4311 \
            --env TOKEN_TALK_PUBLIC_ORIGIN=https://182.92.85.15 \
            --env TOKEN_TALK_RESEARCH_USER_AGENT='TokenTalk-CI/0.1 (ci@example.com)' \
            token-talk:ci
          trap 'docker stop token-talk-ci >/dev/null 2>&1 || true' EXIT
          ready=0
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4329/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [[ "$ready" -ne 1 ]]; then
            docker logs token-talk-ci
            exit 1
          fi
          curl --fail --silent --show-error --header 'Host: 182.92.85.15' http://127.0.0.1:4329/api/health >/dev/null
          index="$(curl --fail --silent --show-error http://127.0.0.1:4329/)"
          printf '%s' "$index" | grep --quiet 'Token Talk Studio'
          asset_path="$(printf '%s' "$index" | grep --only-matching '/assets/[^" ]*\.js' | head -n 1)"
          [[ -n "$asset_path" ]] || { echo '未找到根路径入口脚本。' >&2; exit 1; }
          headers="$(mktemp)"
          curl --fail --silent --show-error --dump-header "$headers" --output /dev/null "http://127.0.0.1:4329$asset_path"
          grep --ignore-case --extended-regexp --quiet '^content-type: (text|application)/javascript' "$headers"
      - name: Smoke test the workspace backup
        run: |
          set -Eeuo pipefail
          volume=token-talk_ci_backup_source
          backup_root="$(mktemp -d)"
          trap 'docker volume rm "$volume" >/dev/null 2>&1 || true; rm -rf "$backup_root"' EXIT
          docker volume create "$volume" >/dev/null
          docker run --rm --user 0:0 --volume "$volume:/source" --entrypoint sh token-talk:ci \
            -c 'printf backup-probe >/source/probe.txt'
          docker tag token-talk:ci token-talk:candidate
          TOKEN_TALK_WORKSPACE_VOLUME="$volume" TOKEN_TALK_BACKUP_ROOT="$backup_root" \
            bash scripts/backup-production.sh
          archive="$(find "$backup_root" -maxdepth 1 -type f -name 'token-talk-*.tar.gz' -print -quit)"
          [[ -n "$archive" ]] || { echo '备份脚本未生成归档。' >&2; exit 1; }
          tar -tzf "$archive" | grep --fixed-strings --line-regexp --quiet './probe.txt'

  security:
    name: Production dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --registry=https://registry.npmjs.org --prod --audit-level high

  deploy:
    name: Deploy to Alibaba Cloud ECS
    runs-on: ubuntu-latest
    needs: [verify, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: Validate deployment trust anchors
        env:
          SERVER_FINGERPRINT: ${{ secrets.SERVER_FINGERPRINT }}
        run: |
          set -Eeuo pipefail
          [[ "$SERVER_FINGERPRINT" =~ ^SHA256:[A-Za-z0-9+/]{43}$ ]] || {
            echo 'SERVER_FINGERPRINT is missing or invalid.' >&2
            exit 1
          }
      - name: Deploy with health checks and rollback
        uses: appleboy/ssh-action@2ead5e36573f08b82fbfce1504f1a4b05a647c6f
        env:
          PROJECT_PATH: ${{ secrets.PROJECT_PATH }}
          PUBLIC_HEALTH_URL: ${{ secrets.PUBLIC_HEALTH_URL }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          fingerprint: ${{ secrets.SERVER_FINGERPRINT }}
          command_timeout: 45m
          envs: PROJECT_PATH,PUBLIC_HEALTH_URL
          script: |
            set -Eeuo pipefail
            release_path="${PROJECT_PATH}.release"
            cd "$PROJECT_PATH"
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            if [[ -e "$release_path/.git" ]]; then
              git -C "$release_path" checkout --detach origin/main
            elif [[ -e "$release_path" ]]; then
              echo "Release path exists but is not a Git worktree: $release_path" >&2
              exit 1
            else
              git worktree add --detach "$release_path" origin/main
            fi
            TOKEN_TALK_ENV_FILE="$PROJECT_PATH/.env.prod" \
              PUBLIC_HEALTH_URL="$PUBLIC_HEALTH_URL" \
              bash "$release_path/scripts/deploy-production.sh"
